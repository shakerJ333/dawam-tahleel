<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام تحليل بصمة الدوام</title>
<meta name="description" content="نظام متكامل لتحليل بصمات حضور وانصراف المعلمين والموظفين محلياً داخل المتصفح مع تقارير وإحصائيات دقيقة وتصدير إكسل">
<meta property="og:title" content="نظام تحليل بصمة الدوام">
<meta property="og:description" content="نظام متكامل لتحليل بصمات حضور وانصراف المعلمين والموظفين محلياً داخل المتصفح دون رفع أي بيانات">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ===== الهوية البصرية: سبّورة تعليمية خضراء داكنة + طباشير أصفر + ورق رسمي هادئ ===== */
:root {
  --bg: #eef2ef;
  --card: #ffffff;
  --tx: #141c19;
  --mu: #435b54;
  --thb: #d3e7e0;
  --tht: #0e3334;
  --pr: #0f3d3e;
  --pr-light: #165354;
  --ac: #e9a914;
  --ac2: #1f8a6a;
  --bd: #d5dfdb;
  --bd2: #9fb3ad;
  --ok: #d6eedf;
  --ab: #f6d2cd;
  --lt: #fde3b8;
  --er: #faefa6;
  --inc: #e3e6e8;
  --exc: #d2e3fa;
  --off: #eef1f3;
  --sh: 0 1px 3px rgba(15,61,62,.08), 0 8px 24px -10px rgba(15,61,62,.16);
}
:root[data-theme=dark] {
  --bg: #091718;
  --card: #102627;
  --tx: #e6f1ee;
  --mu: #9bb5b0;
  --thb: #082829;
  --tht: #eaf3f0;
  --pr: #062021;
  --pr-light: #0d3637;
  --ac: #f2b933;
  --ac2: #4fd1a1;
  --bd: #213e3f;
  --bd2: #386062;
  --ok: #175038;
  --ab: #5c2623;
  --lt: #5c3f16;
  --er: #59511a;
  --inc: #2c3839;
  --exc: #1f4170;
  --off: #172a2b;
  --sh: 0 2px 8px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Tajawal, Cairo, system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--tx);
  line-height: 1.65;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .cards b, .drop b {
  font-family: 'Reem Kufi', Tajawal, sans-serif;
}

/* Header */
header {
  background: var(--pr);
  color: #f4f7f5;
  padding: 12px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px 20px;
  align-items: center;
  border-bottom: 4px solid var(--ac);
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1 1 290px;
  color: var(--ac);
}
.brand h1 {
  font-size: 1.45rem;
  margin: 0;
  color: #f4f7f5;
  line-height: 1.2;
  font-weight: 700;
}
.brand small {
  color: #a9c4be;
  font-size: .84rem;
  display: block;
}
.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  font-size: .88rem;
}
header input, header select, header button {
  font: inherit;
  padding: 6px 11px;
  border-radius: 8px;
  border: 1px solid #2f6567;
  background: #0b2e2f;
  color: #f4f7f5;
  transition: border-color .15s, background .15s;
}
header input:focus, header select:focus {
  outline: none;
  border-color: var(--ac);
}
header input[type=file] {
  max-width: 220px;
  cursor: pointer;
}
header label {
  display: flex;
  gap: 6px;
  align-items: center;
  color: #a9c4be;
  font-size: .82rem;
}
header input::placeholder {
  color: #7fa39d;
}
.head-btn {
  background: #174e50;
  border: 1px solid #3a7a7c;
  cursor: pointer;
  font-weight: 600;
}
.head-btn:hover {
  background: #206265;
  border-color: var(--ac);
}

/* Navigation Tabs */
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 22px;
  background: var(--card);
  border-bottom: 1px solid var(--bd);
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,.03);
}
nav .tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font: inherit;
  font-weight: 600;
  font-size: .88rem;
  color: var(--tx);
  cursor: pointer;
  padding: 4px 12px 4px 5px;
  border-radius: 12px;
  border: 1.5px solid var(--c);
  background: color-mix(in srgb, var(--c) 10%, var(--card));
  transition: transform .15s, background .15s, box-shadow .15s;
}
nav .tab i {
  font-style: normal;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--c);
  font-size: 1.05rem;
}
nav .tab:hover {
  transform: translateY(-2px);
  background: color-mix(in srgb, var(--c) 22%, var(--card));
}
nav .tab.on {
  background: color-mix(in srgb, var(--c) 35%, #fff);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent);
  font-weight: 700;
}
:root[data-theme=dark] nav .tab.on {
  background: color-mix(in srgb, var(--c) 45%, #0e2021);
}
nav .tab:focus-visible, .pb:focus-visible, .drop:focus-within {
  outline: 2px solid var(--ac2);
  outline-offset: 2px;
}
nav .pb {
  margin: 0 0 0 4px;
  padding: 6px 13px;
  font-size: .86rem;
}

/* Main Layout */
main {
  padding: 22px;
  max-width: 1520px;
  margin: auto;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 16px;
  box-shadow: var(--sh);
}
.cards .card {
  border-top: 4px solid var(--ac2);
  color: var(--mu);
  font-size: .9rem;
}
.cards b {
  display: block;
  font-size: 1.95rem;
  color: var(--tx);
  line-height: 1.2;
  margin-top: 2px;
}
.cards .card:nth-child(4), .cards .card:nth-child(5) {
  border-top-color: var(--ac);
}
.cards .card:nth-child(6) {
  border-top-color: #c4473a;
}
.cards .card:nth-child(7) {
  grid-column: span 2;
  background: #fbe7a8;
  color: #1a1a1a;
  border-color: var(--ac);
  border-top-color: var(--ac);
  border-radius: 14px 14px 28px 14px;
}
.cards .card:nth-child(7) b {
  font-size: 2.6rem;
  color: #000;
}
.grid2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 16px;
  margin-bottom: 16px;
}

/* Tables */
.wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--bd);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--sh);
  position: relative;
  max-width: 100%;
}
.wrap::-webkit-scrollbar {
  height: 8px;
}
.wrap::-webkit-scrollbar-track {
  background: color-mix(in srgb, var(--bd) 35%, transparent);
  border-radius: 4px;
}
.wrap::-webkit-scrollbar-thumb {
  background: var(--bd2);
  border-radius: 4px;
}
.wrap::-webkit-scrollbar-thumb:hover {
  background: var(--ac2);
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  table-layout: auto !important;
  font-size: .88rem;
  min-width: max-content;
}
th, td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--bd2);
  border-left: 1px solid var(--bd2);
  text-align: center;
  vertical-align: middle;
  white-space: nowrap !important; /* Prevents words and numbers from breaking into multiple awkward lines */
  width: 1%; /* Shrink column tightly to exact width of words or numbers */
}
table tr > th:first-child, table tr > td:first-child {
  border-right: 1px solid var(--bd2);
}
table thead tr:first-child > th {
  border-top: 1px solid var(--bd2);
}
th {
  position: sticky;
  top: 0;
  background: var(--thb);
  color: var(--tht);
  cursor: pointer;
  z-index: 2;
  font-weight: 700;
  white-space: nowrap !important;
  vertical-align: middle;
  text-align: center;
  user-select: none;
}
tbody tr:nth-child(even) td {
  background: color-mix(in srgb, var(--bd) 22%, transparent);
}
tbody tr:hover td {
  background: color-mix(in srgb, var(--ac) 16%, transparent);
}

/* Flexible text columns (Teacher name): display fully without wrapping */
.col-name,
table.sm th:nth-child(2), table.sm td:nth-child(2),
table.st th.col-name, table.st td.col-name {
  width: auto !important;
  min-width: max-content !important;
  text-align: right !important;
  white-space: nowrap !important;
}

/* Notes & Remarks columns: natural comfortable width */
.col-notes,
table.st th.col-notes, table.st td.col-notes {
  width: auto !important;
  min-width: 160px;
  max-width: 340px;
  white-space: normal !important;
  text-align: right !important;
}

/* Row numbers (م) column */
.col-idx,
table.sm th:nth-child(1), table.sm td:nth-child(1) {
  width: 1% !important;
  min-width: 44px !important;
  max-width: 44px !important;
  text-align: center !important;
}

/* Specific styling for the Teachers Summary table (.sm) */
.sm {
  width: 100%;
  min-width: max-content;
}
.sm th {
  padding: 8px 8px;
  font-size: .84rem;
  line-height: 1.35;
  background: var(--thb);
  color: var(--tht);
  white-space: nowrap;
}

/* Sticky column 1: Serial number (م) */
.sm th:nth-child(1), .sm td:nth-child(1) {
  position: sticky;
  right: 0;
  width: 44px;
  min-width: 44px;
  max-width: 44px;
  text-align: center;
  z-index: 3;
  background: var(--card);
  font-weight: 700;
  color: var(--mu);
}
.sm thead tr:first-child th:nth-child(1),
.sm thead tr.fr th:nth-child(1),
.sm tfoot tr td:nth-child(1) {
  background: var(--thb) !important;
  z-index: 6;
}

/* Sticky column 2: Teacher Full Name - DISPLAYED FULLY, NEVER CUT OFF */
.sm th:nth-child(2), .sm td:nth-child(2) {
  position: sticky;
  right: 44px;
  min-width: 270px;
  max-width: 420px;
  text-align: right !important;
  white-space: nowrap !important;
  z-index: 3;
  background: var(--card);
  box-shadow: -4px 0 8px -2px rgba(15,61,62,.12);
}
.sm thead tr:first-child th:nth-child(2),
.sm thead tr.fr th:nth-child(2),
.sm tfoot tr td:nth-child(2) {
  background: var(--thb) !important;
  z-index: 6;
}

tbody tr:nth-child(even) .sm td:nth-child(1),
tbody tr:nth-child(even) .sm td:nth-child(2) {
  background: color-mix(in srgb, var(--bd) 22%, var(--card));
}
tbody tr:hover .sm td:nth-child(1),
tbody tr:hover .sm td:nth-child(2) {
  background: color-mix(in srgb, var(--ac) 20%, var(--card)) !important;
}

/* Teacher Avatar & Name typography */
.teacher-box {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: right;
  white-space: nowrap;
}
.teacher-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pr), var(--pr-light));
  color: #fff;
  display: inline-grid;
  place-items: center;
  font-size: .84rem;
  font-weight: 700;
  flex-shrink: 0;
  border: 1.5px solid var(--bd2);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}
.teacher-info {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  min-width: 0;
}
.teacher-full-name {
  font-weight: 700;
  font-size: .95rem;
  color: var(--tx);
  letter-spacing: -0.2px;
  white-space: nowrap !important;
}

/* Summary KPI Ribbon Cards */
.sum-kpi-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}
.kpi-chip {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--sh);
  border-top: 3.5px solid var(--ac2);
}
.kpi-chip:nth-child(4), .kpi-chip:nth-child(5) {
  border-top-color: var(--ac);
}
.kpi-chip:nth-child(3) {
  border-top-color: #c4473a;
}
.kpi-chip .kpi-icon {
  font-size: 1.6rem;
  line-height: 1;
}
.kpi-chip small {
  display: block;
  font-size: .78rem;
  color: var(--mu);
}
.kpi-chip b {
  font-size: 1.25rem;
  color: var(--tx);
  font-family: 'Reem Kufi', Tajawal, sans-serif;
  line-height: 1.2;
}

/* Summary Toolbar */
.sum-toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  background: color-mix(in srgb, var(--ac2) 8%, var(--card));
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 8px 14px;
}
.sum-info-hint {
  font-size: .88rem;
  color: var(--tx);
}
.sum-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.pill-warn {
  background: #fde3b8;
  color: #8c4e00;
  font-size: .72rem;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 600;
  white-space: nowrap;
}
.pill-irr {
  background: #f6d2cd;
  color: #8a1f18;
  font-size: .72rem;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-warning {
  background: #faefa6;
  color: #735900;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  display: inline-block;
}
.hot-severe {
  background: #f6d2cd !important;
  color: #8c1d18 !important;
  font-weight: 800 !important;
}
.hot-mild {
  background: #fde3b8 !important;
  color: #7c4100 !important;
  font-weight: 700 !important;
}
.score-pill {
  font-size: 1.05rem;
  font-weight: 800;
  font-family: 'Reem Kufi', Tajawal, sans-serif;
}
.stat-bar-val {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 3px;
}

.mx td, .mx th {
  text-align: center;
  padding: 3px 2px;
  min-width: 24px;
  font-size: .8rem;
  white-space: nowrap;
}
.mx td:first-child, .mx th:first-child {
  position: sticky;
  right: 0;
  background: var(--card);
  z-index: 3;
  text-align: right;
  min-width: 150px;
  font-weight: 600;
}
.mx th:first-child {
  background: var(--thb);
}
.mx td.wk, .mx th.wk {
  border-right: 3px solid var(--ac);
}
.mx tbody tr:nth-child(even) td:not([class*=c-]) {
  background: var(--card);
}
.c-ح { background: var(--ok) !important; color: var(--tx); }
.c-غ { background: var(--ab) !important; font-weight: 700; color: var(--tx); cursor: pointer; }
.c-ت { background: var(--lt) !important; }
.c-م { background: var(--er) !important; }
.c-ب { background: var(--inc) !important; font-style: italic; }
.c-إ { background: var(--exc) !important; cursor: pointer; }

.hot { background: var(--lt); }
.sm tfoot td {
  position: sticky;
  bottom: 0;
  background: var(--thb);
  color: var(--tht);
  font-weight: 700;
}
.pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  color: #000;
  font-size: .8rem;
  font-weight: 700;
}
.warn {
  background: var(--lt);
  border-right: 5px solid var(--ac);
  border-radius: 10px;
  padding: 10px 14px;
  margin: 7px 0;
  font-size: .92rem;
}
.msg {
  padding: 50px 20px;
  text-align: center;
  color: var(--mu);
  font-size: 1.1rem;
}

/* Empty Drop Zone */
.drop-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  max-width: 760px;
  margin: 30px auto;
}
.drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 60px 24px;
  width: 100%;
  border: 3px dashed var(--ac);
  border-radius: 28px 28px 12px 28px;
  background: var(--card);
  cursor: pointer;
  text-align: center;
  box-shadow: var(--sh);
  transition: background .2s, border-color .2s;
}
.drop:hover {
  background: color-mix(in srgb, var(--ac) 10%, var(--card));
  border-color: var(--ac2);
}
.drop svg {
  color: var(--pr);
}
.drop b {
  font-size: 1.75rem;
}
.drop span {
  color: var(--mu);
  font-size: .98rem;
}
.drop em {
  font-style: normal;
  font-size: .88rem;
  color: var(--ac2);
  margin-top: 8px;
  font-weight: 600;
}
.demo-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  width: 100%;
}
.demo-btn {
  background: var(--pr);
  color: #fff;
  border: 1px solid var(--ac);
  padding: 10px 20px;
  border-radius: 10px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: transform .15s, background .15s;
}
.demo-btn:hover {
  transform: translateY(-2px);
  background: var(--pr-light);
}

.drop.drag-over {
  background: color-mix(in srgb, var(--ac) 20%, var(--card)) !important;
  border-color: var(--ac) !important;
  border-style: solid !important;
  transform: scale(1.015);
  box-shadow: 0 12px 32px rgba(233, 169, 20, 0.25) !important;
}
.drop-browse-btn {
  background: var(--pr);
  color: #fff;
  border: 1.5px solid var(--ac);
  border-radius: 10px;
  padding: 10px 24px;
  font-weight: 700;
  font-size: 1rem;
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(15, 61, 62, 0.25);
  transition: transform .15s, background .15s;
}
.drop-browse-btn:hover {
  transform: translateY(-2px);
  background: var(--pr-light);
}
.quick-actions-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
}
.quick-action-btn {
  background: var(--card);
  color: var(--tx);
  border: 1.5px solid var(--bd2);
  padding: 9px 16px;
  border-radius: 10px;
  font: inherit;
  font-size: .88rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all .15s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,.04);
}
.quick-action-btn:hover {
  border-color: var(--ac2);
  background: color-mix(in srgb, var(--ac2) 8%, var(--card));
  transform: translateY(-2px);
}
.paste-textarea {
  width: 100%;
  box-sizing: border-box;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: .84rem;
  padding: 12px;
  border: 1.5px solid var(--bd2);
  border-radius: 10px;
  background: var(--bg);
  color: var(--tx);
  direction: ltr;
  text-align: left;

const p2 = n => String(n).padStart(2, '0');

/* ===== محرك الاستيراد الذكي المتطور لجداول وسجلات البصمة ===== */
function parseTime(v) {
  if (v === '' || v == null) return null;
  if (typeof v === 'number') {
    const frac = v >= 1 ? (v % 1) : v;
    return Math.round(frac * 1440);
  }
  const s = dg(String(v)).trim();
  if (!s) return null;

  // Match 12-hour or 24-hour time with optional seconds and AM/PM / ص/م
  const m = s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm|[صم])?/i);
  if (m) {
    let h = +m[1];
    const min = +m[2];
    const period = m[4] ? m[4].toLowerCase() : '';
    if (period === 'pm' || period === 'م') {
      if (h < 12) h += 12;
    } else if (period === 'am' || period === 'ص') {
      if (h === 12) h = 0;
    }
    return h * 60 + min;
  }

  // Fallback: 4 digits like 0745 or 1230
  const m4 = s.match(/^(\d{2})(\d{2})$/);
  if (m4) {
    const h = +m4[1], min = +m4[2];
    if (h < 24 && min < 60) return h * 60 + min;
  }

  return null;
}

function parseDate(v) {
  if (v === '' || v == null) return null;
  let y, m, d;
  if (typeof v === 'number') {
    const t = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 864e5);
    y = t.getUTCFullYear();
    m = t.getUTCMonth() + 1;
    d = t.getUTCDate();
  } else if (v instanceof Date) {
    y = v.getFullYear();
    m = v.getMonth() + 1;
    d = v.getDate();
  } else {
    const s = dg(String(v)).trim();
    if (!s) return null;

    let r = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (r) {
      y = +r[1]; m = +r[2]; d = +r[3];
    } else {
      r = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
      if (r) {
        let p1 = +r[1], p2 = +r[2];
        const yr = +r[3];
        if (p1 > 12) {
          d = p1; m = p2;
        } else if (p2 > 12) {
          m = p1; d = p2;
        } else {
          d = p1; m = p2;
        }
        y = yr;
      } else {
        return null;
      }
    }
  }
  if (!y || !m || !d || y < 1970 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return y + '-' + p2(m) + '-' + p2(d);
}

  if (v === '' || v == null) return { date: null, time: null };

// البحث الذكي عن صف الترويسة الفعلي
function findHeaderRow(rows) {
  let bestRow = 0;
  let maxScore = -1;
  let bestIx = {};

  const limit = Math.min(25, rows.length);
  for (let r = 0; r < limit; r++) {
    const row = rows[r];
    if (!row || !row.length) continue;
    const hd = row.map(cell => norm(String(cell ?? '')));
    const ix = {};
    let score = 0;

    for (const k in SYN) {
      ix[k] = hd.findIndex(h => h && SYN[k].some(s => h === norm(s) || h.includes(norm(s))));
      if (ix[k] >= 0) {
        score += (k === 'id' || k === 'name' || k === 'date' || k === 'in') ? 3 : 1;
      }
    }

    if (ix.datetime >= 0) score += 4;

    if (score > maxScore) {
      maxScore = score;
      bestRow = r;
      bestIx = ix;
    }
  }

  return { headerRow: bestRow, score: maxScore, ix: bestIx };
}

// الاستكشاف الذكي للأعمدة حسب نمط محتوى البيانات
function guessColumnsFromData(dataRows, headers, detectedIx) {
  const ix = { ...detectedIx };
  const sample = dataRows.slice(0, 20);
  if (!sample.length) return ix;

  const colCount = Math.max(...sample.map(r => r.length));

  for (let c = 0; c < colCount; c++) {
    if (Object.values(ix).includes(c)) continue;
    const values = sample.map(r => r[c]).filter(v => v !== '' && v != null);
    if (!values.length) continue;

    if (ix.date < 0 && values.filter(v => parseDate(v) != null).length >= values.length * 0.6) {
      ix.date = c;
      continue;
    }

    if (values.filter(v => parseTime(v) != null).length >= values.length * 0.6) {
      if (ix.in < 0) {
        ix.in = c;
        continue;
      } else if (ix.out < 0 && ix.in !== c) {
        ix.out = c;
        continue;
      }
    }

    if (ix.id < 0 && values.filter(v => {
      const s = String(v).trim();
      return /^\d{3,12}$/.test(s) || /^[A-Z0-9-]{3,12}$/i.test(s);
    }).length >= values.length * 0.7) {
      ix.id = c;
      continue;
    }

    if (ix.name < 0 && values.filter(v => {
      const s = String(v).trim();
      return /[\u0600-\u06FF]/.test(s) && s.includes(' ');
    }).length >= values.length * 0.6) {
      ix.name = c;
      continue;
    }
  }

  return ix;
}

    const lines = raw.trim().split(/\r?\n/).filter(Boolean);
    if (!lines.length) {
      parsedRows = [];
      stats.textContent = 'لم يتم لصق أي بيانات بعد';
      stats.style.color = 'var(--mu)';
      btnProcess.disabled = true;
      previewWrap.style.display = 'none';
      return;
    }

    const firstLine = lines[0];
    let delim = '\t';
    if (!firstLine.includes('\t')) {
      if (firstLine.includes(';')) delim = ';';
      else if (firstLine.includes(',')) delim = ',';
      else if (firstLine.includes('|')) delim = '|';
    }

    parsedRows = lines.map(line => line.split(delim).map(c => c.trim().replace(/^["']|["']$/g, '')));
    const colCount = Math.max(...parsedRows.map(r => r.length));

    stats.textContent = `✓ تم رصد ${parsedRows.length.toLocaleString('ar-EG')} صفاً و ${colCount.toLocaleString('ar-EG')} أعمدة`;
    stats.style.color = 'var(--ac2)';
    btnProcess.disabled = false;

    const sample = parsedRows.slice(0, 4);
    previewTable.innerHTML = `
      <thead><tr>${sample[0].map((c, i) => `<th>${esc(c || `عمود ${i+1}`)}</th>`).join('')}</tr></thead>
      <tbody>${sample.slice(1).map(r => `<tr>${sample[0].map((_, i) => `<td>${esc(r[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody>
    `;
    previewWrap.style.display = 'block';
  };

  ta.addEventListener('input', () => parseText(ta.value));

  backdrop.querySelector('#btnSamplePaste').onclick = () => {
    ta.value = "الرقم الوزاري\tاسم المعلم\tالتاريخ\tأول تسجيل دخول\tآخر تسجيل خروج\tالمدرسة\n104201\tسلطان بن حمود الحربي\t2026-10-04\t07:35\t12:25\tمدرسة الأمل الثانوية\n104202\tمحمد بن إبراهيم القحطاني\t2026-10-04\t07:42\t12:20\tمدرسة الأمل الثانوية\n104203\tخالد بن ناصر الغامدي\t2026-10-04\t07:55\t12:30\tمدرسة الأمل الثانوية";
    parseText(ta.value);
  };

  btnProcess.onclick = () => {
    if (!parsedRows.length) return;
    backdrop.remove();
    S.lastLoadedFile = { name: 'بيانات_ملصقة_من_الحافظة.xlsx', data: parsedRows };
    ingest(parsedRows, null, 'بيانات_ملصقة_من_الحافظة.xlsx');
    S.tab = 'dash';
    view();
  };

  backdrop.querySelector('#btnCancelPaste').onclick = () => backdrop.remove();
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
  setTimeout(() => ta.focus(), 60);
}

function ingest(rows, manualConfig = null, fileName = '') {
  if (!rows || !rows.length) throw new Error('الملف فارغ أو تعذّرت قراءته.');

  let headerRow = 0;
  let ix = {};

  if (manualConfig) {
    headerRow = manualConfig.headerRow;
    ix = manualConfig.ix;
  } else {
    const found = findHeaderRow(rows);
    headerRow = found.headerRow;
    ix = guessColumnsFromData(rows.slice(headerRow + 1), rows[headerRow], found.ix);

    if (ix.datetime >= 0) {
      if (ix.date < 0) ix.date = ix.datetime;
      if (ix.in < 0) ix.in = ix.datetime;
    }

    const missingRequired = ['id', 'name', 'date', 'in'].filter(k => ix[k] == null || ix[k] < 0);
    if (missingRequired.length) {
      showColumnMappingModal(rows, headerRow, ix, fileName, 'لم نتمكن من مطابقة بعض الأعمدة الأساسية تلقائياً. يرجى اختيارها أدناه:');
      return;
    }
  }

  const Q = { read: 0, skip: 0, dup: 0, wkend: 0, single: 0, outr: 0, short: 0, long: 0, names: [], ids: [] };
  const map = new Map(), nm = new Map(), idn = new Map();

  const dataRows = rows.slice(headerRow + 1);

  for (const r of dataRows) {
    if (!r || !r.length) continue;
    const id = clean(r[ix.id]);
    const name = clean(r[ix.name]).replace(/\s*\/\s*new\b/ig, '').replace(/\s+1$/, '').trim();

    let dateVal = r[ix.date];
    let date = parseDate(dateVal);

    let inTime = parseTime(r[ix.in]);
    let outTime = (ix.out >= 0 && ix.out !== ix.in) ? parseTime(r[ix.out]) : null;

    if (!inTime && dateVal) {
      inTime = parseTime(dateVal);
    }

    if (!id || !name || !date) {
      Q.skip++;
      continue;
    }
    Q.read++;

    const dow = new Date(date + 'T00:00:00Z').getUTCDay();
    if (dow >= 5) Q.wkend++;

    const k = id + '|' + date;
    const ts = [inTime, outTime].filter(t => t != null);

    if (map.has(k)) {
      Q.dup++;
      map.get(k).ts.push(...ts);
    } else {
      const school = (ix.school >= 0 && r[ix.school]) ? clean(r[ix.school]) : '';
      map.set(k, { id, name, date, school, ts });
    }
    (idn.get(id) || idn.set(id, new Set()).get(id)).add(name);
    (nm.get(name) || nm.set(name, new Set()).get(name)).add(id);
  }

  const recs = [];
  map.forEach(r => {
    if (!r.ts.length) { Q.skip++; return; }
    const a = Math.min(...r.ts), b = Math.max(...r.ts);
    if (a === b) {
      r.t = a;
      Q.single++;
    } else {
      r.in = a;
      r.out = b;
      const d = b - a;
      if (d < 60) Q.short++;
      if (d > 600) Q.long++;
    }
    if (a < S.cfg.from || b > S.cfg.to) Q.outr++;
    recs.push(r);
  });

  idn.forEach((v, k) => { if (v.size > 1) Q.names.push(k + ': ' + [...v].join(' / ')); });
  nm.forEach((v, k) => { if (v.size > 1) Q.ids.push(k + ': ' + [...v].join(' / ')); });

  if (!recs.length) {
    throw new Error('لا توجد سجلات صالحة في الملف بعد المعالجة. يرجى التحقق من صحة أعمدة التاريخ والأوقات.');
  }

  S.recs = recs;
  S.Q = Q;
  const ds = recs.map(r => r.date).sort();
  S.min = ds[0];
  S.max = ds[ds.length - 1];
  S.from = S.min;
  S.to = S.max;
  S.ov = {};
  S.exc = {};
  S.delE = {};
  S.skip = {};
  S.noE = {};
  S.flt = {};

  const sc = [...new Set(recs.map(r => r.school))].filter(Boolean);
  $('#school').innerHTML = '<option value="">كل المدارس</option>' + sc.map(s => `<option>${esc(s)}</option>`).join('');
  $('#from').value = S.from;
  $('#to').value = S.to;

  S.importMeta = {
    fileName: fileName || (S.importMeta ? S.importMeta.fileName : 'ملف البصمة'),
    rawRows: rows,
    headerRow,
    ix,
    totalPunches: Q.read,
    uniqueTeachers: new Set(recs.map(r => r.id)).size,
    pattern: (ix.out >= 0 && ix.out !== ix.in) ? 'سجل حضور وانصراف يومي مباشر (دخول وخروج)' : 'سجل حركات البصمة المجمعة (حركات متتالية)',
    dateRange: `${S.from} إلى ${S.to}`
  };
}

/* ===== analyzer: دوال الحساب ===== */
function grade(s) {
  return s >= 9 ? ['ممتاز', '#5fd3a0'] :
         s >= 8 ? ['جيد جداً', '#7cc4ee'] :
         s >= 7 ? ['جيد', '#c8dc5a'] :
         s >= 5 ? ['مقبول', '#f5b955'] :
                  ['ضعيف', '#f08a80'];
}

function analyze() {
  const c = S.cfg, emps = new Map(), odd = {};
  S.recs.filter(r => (!S.sel || r.school === S.sel) && !S.delE[r.id] && !S.skip[r.id + '|' + r.date]).forEach(r => {
    if (!emps.has(r.id)) emps.set(r.id, { id: r.id, name: r.name, school: r.school, m: new Map(), raw: [] });
    const e = emps.get(r.id);
    e.raw.push(r);
    const ts = [r.t, r.in, r.out].filter(t => t != null);
    const bad = Math.min(...ts) < c.from || Math.max(...ts) > c.to;
    if (bad || !c.days.includes(new Date(r.date + 'T00:00:00Z').getUTCDay())) {
      odd[r.id] = (odd[r.id] || 0) + 1;
    }
    if (!bad) e.m.set(r.date, r);
  });

  const dates = [];
  if (S.min) {
    for (let t = Date.parse(S.min + 'T00:00:00Z'); t <= Date.parse(S.max + 'T00:00:00Z'); t += 864e5) {
      dates.push(new Date(t).toISOString().slice(0, 10));
    }
  }

  const info = {}, n = emps.size;
  dates.forEach(d => {
    const dow = new Date(d + 'T00:00:00Z').getUTCDay();
    let cnt = 0;
    emps.forEach(e => { if (e.m.has(d)) cnt++; });
    let type = !c.days.includes(dow) ? 'weekend' : (cnt < (c.hol / 100) * n ? 'off' : 'work');
    if (S.ov[d]) type = S.ov[d];
    info[d] = { dow, cnt, type, auto: !S.ov[d] };
  });

  const work = dates.filter(d => info[d].type === 'work' && d >= S.from && d <= S.to);
  const list = [];

  emps.forEach(e => {
    const o = {
      id: e.id, name: e.name, school: e.school, pres: 0, abs: 0, exc: 0,
      late: [], early: [], inc: 0, cells: {}, lateMin: 0, earlyMin: 0,
      maxLate: 0, maxStreak: 0, severe: 0, noOut: 0, sus: 0, skipN: 0
    };
    let cur = 0;

    work.forEach(d => {
      if (S.skip[e.id + '|' + d]) { o.skipN++; return; }
      const r = e.m.get(d), nx = c.noExit && d === c.noExit;

      if (!r) {
        if (S.exc[e.id + '|' + d]) {
          o.exc++;
          o.cells[d] = 'إ';
          cur = 0;
        } else {
          o.abs++;
          o.cells[d] = 'غ';
          cur++;
          o.maxStreak = Math.max(o.maxStreak, cur);
        }
        return;
      }

      cur = 0;
      o.pres++;
      let a = r.in, b = r.out;
      if (r.t != null) {
        if (r.t < c.single) { a = r.t; b = null; }
        else { a = null; b = r.t; }
      }

      if (a != null && b == null && !nx) o.noOut++;
      if (a != null && b != null && (b - a < 60 || b - a > 600)) o.sus++;

      let code = 'ح';
      if (a != null && a > c.start + c.grace) {
        const lm = a - (c.full ? c.start : c.start + c.grace);
        o.late.push({ d, t: a, m: lm });
        o.lateMin += lm;
        o.maxLate = Math.max(o.maxLate, lm);
        if (lm >= c.severe) o.severe++;
        code = 'ت';
      }
      if (a != null && b != null && b < c.end - c.egrace && !nx && !S.noE[e.id + '|' + d]) {
        const em = c.end - c.egrace - b;
        o.early.push({ d, t: b, m: em });
        o.earlyMin += em;
        if (code === 'ح') code = 'م';
      }
      if ((a == null || b == null) && !(nx && b == null)) {
        o.inc++;
        if (code === 'ح') code = 'ب';
      }
      o.cells[d] = code;
    });

    o.due = work.length - o.exc - o.skipN;
    o.few = (o.pres / Math.max(1, work.length)) * 100 < c.few;
    o.irr = (odd[e.id] || 0) >= c.irrN;
    o.raw = e.raw;
    o.sus += odd[e.id] || 0;

    const P = o.pres || 1;
    o.att = o.due ? o.pres / o.due : 0;
    o.pun = (o.pres - o.late.length) / P;
    o.dep = (o.pres - o.early.length) / P;
    o.cmp = (o.pres - o.inc) / P;
    o.score = Math.max(0, 10 - o.abs * c.pAbs - o.late.length * c.pLate - o.lateMin * c.pLateMin - o.early.length * c.pEarly - o.earlyMin * c.pEarlyMin - o.inc * c.pInc);
    o.grade = o.irr ? ['غير منتظم', '#bbb'] : grade(o.score);
    list.push(o);
  });

  const ok = list.filter(o => !o.few && !o.irr);
  const sum = (a, f) => a.reduce((s, o) => s + f(o), 0);
  const due = sum(ok, o => o.due);
  const pr = sum(ok, o => o.pres);

  const R = {
    list,
    ok,
    dates,
    info,
    work,
    n: ok.length,
    att: due ? pr / due : 0,
    pun: pr ? (pr - sum(ok, o => o.late.length)) / pr : 0,
    avg: ok.length ? sum(ok, o => o.score) / ok.length : 0,
    lateMin: sum(ok, o => o.lateMin),
    earlyMin: sum(ok, o => o.earlyMin),
    abs: sum(ok, o => o.abs),
    emps
  };
  R.g = grade(R.avg);
  return R;
}

function addFilters() {
  document.querySelectorAll('.fc-bar, .fc').forEach(el => el.remove());

  document.querySelectorAll('#main table.st, #main table.mx').forEach((tb, ti) => {
    if (!tb.tHead || !tb.tHead.rows.length || !tb.tBodies || !tb.tBodies.length) return;
    const key = S.tab + ti;
    const head = tb.tHead.rows[0];
    const body = tb.tBodies[0];
    const mx = tb.classList.contains('mx');
    const saved = S.flt[key] || [];

    const oldFr = tb.tHead.querySelector('tr.fr');
    if (oldFr) oldFr.remove();

    const tr = document.createElement('tr');
    tr.className = 'fr noprint';

    for (let i = 0; i < head.cells.length; i++) {
      const th = document.createElement('th');
      th.className = 'fr' + (head.cells[i].className ? ' ' + head.cells[i].className : '');
      const hCell = head.cells[i];
      const isNoPrint = hCell.classList.contains('noprint');
      const isDelCol = hCell.textContent.trim() === '';
      const isMatrixDay = mx && i > 0 && i < head.cells.length - 1;

      if (!isNoPrint && !isDelCol && !isMatrixDay) {
        const allRows = [...body.rows];
        const counts = new Map();
        let numCount = 0;

        allRows.forEach(q => {
          const cell = q.cells[i];
          if (!cell) return;
          const val = cv(cell);
          if (val !== '' && val != null) {
            counts.set(val, (counts.get(val) || 0) + 1);
            const numPart = val.replace(/[^\d.-]/g, '');
            if (numPart !== '' && !isNaN(+numPart)) numCount++;
          }
        });

        const uniqueVals = [...counts.keys()];
        const hText = hCell.textContent.trim();
        const isHeaderName = hText.includes('المعلم') || hText.includes('اسم');
        let el;

        if (!isHeaderName && uniqueVals.length >= 2 && uniqueVals.length <= 14) {
          el = document.createElement('select');
          el.innerHTML = `<option value="">الكل (${allRows.length})</option>` +
            uniqueVals.sort((a, b) => a.localeCompare(b, 'ar', { numeric: true })).map(v =>
              `<option value="${esc(v)}">${esc(v)} (${counts.get(v)})</option>`
            ).join('');
        } else {
          el = document.createElement('input');
          const isMostlyNumeric = numCount > 0 && numCount >= uniqueVals.length * 0.6;
          el.placeholder = isMostlyNumeric ? '> < = أو رقم' : 'تصفية…';
        }

        el.setAttribute('aria-label', `تصفية عمود ${hText || i}`);
        el.dataset.c = i;
        if (saved[i]) {
          el.value = saved[i];
          el.classList.add('has-val');
          th.classList.add('has-val');
        }
        th.append(el);
      }
      tr.append(th);
    }

    head.after(tr);
    const headHeight = head.offsetHeight;
    tr.querySelectorAll('th').forEach(th => th.style.top = headHeight + 'px');

    const fc = document.createElement('div');
    fc.className = 'noprint fc-bar';
    fc.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px">
        <span class="fc-text"></span>
        <span class="fc-badge-wrap"></span>
      </div>
      <button type="button" class="fc-clear-btn" style="display:none">مسح جميع التصفية ✕</button>
    `;
    const wrap = tb.closest('.wrap');
    if (wrap) wrap.before(fc);

    const apply = () => {
      S.flt[key] = [];
      const filters = [];
      let activeCount = 0;

      tr.querySelectorAll('[data-c]').forEach(e => {
        const raw = e.value;
        const colIdx = +e.dataset.c;
        S.flt[key][colIdx] = raw;
        const v = dg(raw).trim();
        const parentTh = e.closest('th');

        if (v) {
          activeCount++;
          e.classList.add('has-val');
          if (parentTh) parentTh.classList.add('has-val');
          filters.push([colIdx, v, e.tagName === 'SELECT']);
        } else {
          e.classList.remove('has-val');
          if (parentTh) parentTh.classList.remove('has-val');
        }
      });

      let matchCount = 0;
      const allRows = [...body.rows];

      allRows.forEach(q => {
        const ok = filters.every(([ci, fVal, isSel]) => {
          const cell = q.cells[ci];
          if (!cell) return false;
          const text = cv(cell);

          if (isSel) {
            return text === fVal;
          }

          const opMatch = fVal.match(/^(>=|<=|>|<|=|==|!=)\s*(-?[\d.]+)$/);
          if (opMatch) {
            const numVal = parseFloat(text.replace(/[^\d.-]/g, ''));
            const target = +opMatch[2];
            const op = opMatch[1];
            if (isNaN(numVal)) return false;
            if (op === '>') return numVal > target;
            if (op === '<') return numVal < target;
            if (op === '>=') return numVal >= target;
            if (op === '<=') return numVal <= target;
            if (op === '!=') return numVal !== target;
            return numVal === target;
          }

          const rangeMatch = fVal.match(/^(\d+)\s*(\.\.|-)\s*(\d+)$/);
          if (rangeMatch) {
            const numVal = parseFloat(text.replace(/[^\d.-]/g, ''));
            if (isNaN(numVal)) return false;
            return numVal >= +rangeMatch[1] && numVal <= +rangeMatch[3];
          }

          const searchTokens = normSearch(fVal).split(/\s+/).filter(Boolean);
          const normCellText = normSearch(text);
          return searchTokens.every(tok => normCellText.includes(tok));
        });

        q.style.display = ok ? '' : 'none';
        if (ok) matchCount++;
      });

      const totalRows = allRows.length;
      fc.querySelector('.fc-text').innerHTML = `يُعرض <b>${matchCount}</b> من أصل <b>${totalRows}</b> صف`;

      if (activeCount > 0) {
        fc.classList.add('is-active');
        fc.querySelector('.fc-badge-wrap').innerHTML = `<span class="pill-active-filters">${activeCount} تصفية نشطة</span>`;
        fc.querySelector('.fc-clear-btn').style.display = 'inline-block';
      } else {
        fc.classList.remove('is-active');
        fc.querySelector('.fc-badge-wrap').innerHTML = '';
        fc.querySelector('.fc-clear-btn').style.display = 'none';
      }
    };

    tr.addEventListener('input', apply);
    tr.addEventListener('change', apply);

    fc.querySelector('.fc-clear-btn').onclick = () => {
      tr.querySelectorAll('[data-c]').forEach(e => {
        e.value = '';
        e.classList.remove('has-val');
      });
      tr.querySelectorAll('th.fr').forEach(th => th.classList.remove('has-val'));
      S.flt[key] = [];
      apply();
    };

    apply();
  });
}

    h += `<div class="wrap"><table class="mx"><thead><tr><th class="col-name">المعلم</th>${
      ds.map(d => `<th class="${R.info[d].dow === 0 ? 'wk' : ''}" title="${d} ${dn(d)}">${d.slice(8)}/${d.slice(5, 7)}</th>`).join('')
    }<th>غ</th></tr></thead><tbody>`;

    L.forEach(o => {
      h += `<tr><td class="col-name"><button class="x noprint" data-del="E" data-k="${o.id}" aria-label="حذف المعلم">✕</button> ${esc(o.name)}</td>` +
        ds.map(d => {
          const c = o.cells[d] || '';
          if (c === 'غ') col[d]++;
          return `<td class="c-${c === 'ح' ? 'ح' : c} ${R.info[d].dow === 0 ? 'wk' : ''}" data-k="${o.id}|${d}" title="${d} ${dn(d)}">${c === 'ح' ? '✓' : c}</td>`;
        }).join('') +
        `<td>${o.abs}</td></tr>`;
    });

    h += `<tr><td class="col-name" style="font-weight:700">إجمالي الغياب</td>${ds.map(d => `<td>${col[d]}</td>`).join('')}<td></td></tr></tbody></table></div>`;
  }

  if (S.tab === 'eval') {
    EL = L.filter(o => !o.irr).slice().sort((a, b) => b.score - a.score);
    h += tbl(['المعلم', 'الرقم الوزاري', 'نسبة الحضور', 'نسبة الالتزام', 'الدرجة / 10', 'التقدير'],
      EL.map(o => [
        esc(o.name) + flag(o),
        o.id,
        pc(o.att),
        pc(o.pun),
        [`<div style="background:var(--bd);border-radius:6px;min-width:100px;overflow:hidden"><div style="width:${Math.min(100, o.score * 10)}%;background:${o.grade[1]};color:#000;border-radius:6px;padding:1px 6px;font-weight:700">${o.score.toFixed(2)}</div></div>`, o.score.toFixed(3)],
        `<span class="pill" style="background:${o.grade[1]}">${o.grade[0]}</span>`
      ]),
      '', EL.map(o => ['E', o.id])
    );
  }

  if (S.tab === 'irr') {
    const IR = L.filter(o => o.irr).flatMap(o => o.raw.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(x => ({ o, x })));
    h += tbl(['المعلم', 'التاريخ', 'اليوم', 'الدخول / البصمة', 'الخروج'],
      IR.map(({ o, x }) => [esc(o.name), x.date, dn(x.date), fm(x.in ?? x.t), fm(x.out)]),
      '', IR.map(({ o, x }) => ['S', o.id + '|' + x.date])
    );
  }

  if (S.tab === 'days') {
    h += tbl(['التاريخ', 'اليوم', 'الحاضرون', 'النوع', 'تعديل يدوي'],
      R.dates.map(d => {
        const i = R.info[d];
        return [
          d,
          dn(d),
          i.cnt,
          { work: 'دوام رسمي', off: i.auto ? 'عطلة مكتشفة تلقائياً' : 'عطلة محددة يدوياً', weekend: 'عطلة نهاية أسبوع' }[i.type],
          `<select data-d="${d}"><option value="">تلقائي</option><option value="work"${S.ov[d] === 'work' ? ' selected' : ''}>دوام</option><option value="off"${S.ov[d] === 'off' ? ' selected' : ''}>عطلة</option></select>`
        ];
      }),
      '', R.dates.map(d => ['D', d])
    );
  }

  if (S.tab === 'quality') {
    const q = S.Q;
    h += `<div class="cards">${[
      ['صفوف مقروءة', q.read],
      ['صفوف متجاهلة', q.skip],
      ['صفوف مكررة (دُمجت)', q.dup],
      ['صفوف نهاية الأسبوع', q.wkend],
      ['بصمة واحدة فقط', q.single],
      ['خارج النطاق الصالح', q.outr],
      ['مدة أقل من ساعة', q.short],
      ['مدة أكثر من 10 ساعات', q.long],
      ['معلمون بأيام قليلة', R.list.filter(o => o.few).length],
      ['عدد الموظفين الإجمالي', R.emps.size]
    ].map(([a, b]) => `<div class="card">${a}<b>${b}</b></div>`).join('')}</div>`;
    if (S.importMeta) {
      h += `
        <div class="card" style="margin-top:16px;background:color-mix(in srgb, var(--ac2) 8%, var(--card));border:1.5px solid var(--ac2)">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
            <div>
              <b style="font-size:1.05rem;color:var(--pr);display:flex;align-items:center;gap:6px">
                <span>⚙️</span> خريطة استيراد ومطابقة أعمدة ملف البصمة الحالي (${esc(S.importMeta.fileName)})
              </b>
              <div style="font-size:.88rem;color:var(--tx);margin-top:6px;line-height:1.6">
                • الترويسة المكتشفة: <b>الصف رقم ${S.importMeta.headerRow + 1}</b><br>
                • نمط السجلات: <b>${esc(S.importMeta.pattern)}</b><br>
                • العمود المعين للرقم: <b>${S.importMeta.ix.id >= 0 ? 'عمود ' + (S.importMeta.ix.id + 1) : 'غير محدد'}</b> | 
                عمود الاسم: <b>${S.importMeta.ix.name >= 0 ? 'عمود ' + (S.importMeta.ix.name + 1) : 'غير محدد'}</b> | 
                عمود التاريخ: <b>${S.importMeta.ix.date >= 0 ? 'عمود ' + (S.importMeta.ix.date + 1) : 'غير محدد'}</b> | 
                عمود الدخول: <b>${S.importMeta.ix.in >= 0 ? 'عمود ' + (S.importMeta.ix.in + 1) : 'غير محدد'}</b> | 
                عمود الخروج: <b>${S.importMeta.ix.out >= 0 ? 'عمود ' + (S.importMeta.ix.out + 1) : 'غير محدد'}</b>
              </div>
            </div>
            <button class="pb" data-x="open_colmap" style="background:var(--ac2);color:#fff;font-weight:700">فتح مساعد مطابقة الأعمدة ⚙️</button>
          </div>
        </div>`;
    }

    h += '<h3>فحص تعارض الأسماء والأرقام الوزارية</h3>' +
      ([...q.names.map(x => 'رقم بأكثر من اسم — ' + x), ...q.ids.map(x => 'اسم بأكثر من رقم — ' + x)].map(x => `<div class="warn">${esc(x)}</div>`).join('') || '<div class="warn" style="border-right-color:#5fd3a8;background:var(--ok)">لا توجد أي تعارضات في الأرقام أو الأسماء ✓</div>');
  }

  h += renderPrintFooter();
  m.innerHTML = h;
  addFilters();
  if (S.tab === 'matrix' || S.tab === 'dash') after();
}

function after() {
  if (S.tab !== 'dash' || typeof Chart === 'undefined') return;
  const ds = R.work, A = {}, Lt = {}, E = {};
  ds.forEach(d => { A[d] = 0; Lt[d] = 0; E[d] = 0; });
  R.ok.forEach(o => {
    ds.forEach(d => { if (o.cells[d] === 'غ') A[d]++; });
    o.late.forEach(x => { if (x.d in Lt) Lt[x.d]++; });
    o.early.forEach(x => { if (x.d in E) E[x.d]++; });
  });

  const c1 = $('#c1');
  if (c1) {
    charts.push(new Chart(c1, {
      type: 'bar',
      data: {
        labels: ds.map(d => d.slice(8) + '/' + d.slice(5, 7)),
        datasets: [
          { label: 'عدد الغائبين', data: ds.map(d => A[d]), backgroundColor: '#4472c4' },
          { label: 'عدد المتأخرين', data: ds.map(d => Lt[d]), backgroundColor: '#e0584a' },
          { label: 'عدد المغادرين مبكراً', data: ds.map(d => E[d]), backgroundColor: '#1fa67a' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: 'توزيع المتأخرين والغائبين والمغادرين يومياً على مدار الشهر', font: { size: 16, family: 'Tajawal, sans-serif' } },
          legend: { position: 'bottom', labels: { font: { family: 'Tajawal, sans-serif' } } }
        },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'عدد المعلمين' } }
        }
      }
    }));
  }

  const c2 = $('#c2');
  if (c2) {
    const gs = ['ممتاز', 'جيد جداً', 'جيد', 'مقبول', 'ضعيف'];
    charts.push(new Chart(c2, {
      type: 'doughnut',
      data: {
        labels: gs,
        datasets: [{
          data: gs.map(g => R.ok.filter(o => o.grade[0] === g).length),
          backgroundColor: ['#5fd3a0', '#7cc4ee', '#c8dc5a', '#f5b955', '#f08a80']
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: 'توزيع تقديرات كادر المدرسة', font: { size: 16, family: 'Tajawal, sans-serif' } },
          legend: { position: 'bottom', labels: { font: { family: 'Tajawal, sans-serif' } } }
        }
      }
    }));
  }
}

function saveSettings() {
  const c = S.cfg, g = k => document.querySelector(`[data-s=${k}]`);
  const T = ['start', 'end', 'from', 'to', 'single'];
  const N = ['grace', 'egrace', 'severe', 'hol', 'few', 'aStreak', 'aLate', 'aDays', 'pAbs', 'pLate', 'pLateMin', 'pEarly', 'pEarlyMin', 'pInc', 'irrN'];

  T.forEach(k => c[k] = toM(g(k).value));
  N.forEach(k => c[k] = +g(k).value);
  c.full = g('full').checked;
  c.days = [...document.querySelectorAll('[data-wd]')].filter(x => x.checked).map(x => +x.dataset.wd);

  try { localStorage.setItem('cfg_school_attendance', JSON.stringify(c)); } catch(e) {}
  $('#smsg').textContent = '✓ تم حفظ الإعدادات بنجاح';
  setTimeout(() => { S.tab = 'dash'; view(); }, 500);
}

function resetSettings() {
  showConfirmModal({
    title: 'استعادة الإعدادات الافتراضية',
    message: 'هل تريد إعادة ضبط جميع مواعيد الدوام وفترات السماح ونسب الخصم إلى قيمها الأصلية؟',
    details: '<div style="background:var(--bg);border:1px solid var(--bd);padding:8px 12px;border-radius:8px;font-size:.85rem;color:var(--mu);text-align:right">ستتم استعادة مواعيد الدوام الرسمي من 07:45 إلى 12:20 وأيام العمل من الأحد إلى الخميس.</div>',
    confirmText: 'نعم، استعادة الافتراضي',
    cancelText: 'إلغاء',
    danger: false,
    icon: '⚙️',
    onConfirm: () => {
      S.cfg = { ...DEF };
      try { localStorage.removeItem('cfg_school_attendance'); } catch(e) {}

}

/* ===== exporter ===== */
const fitW = ws => {
  const a = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  ws['!cols'] = (a[0] || []).map((_, i) => ({ wch: Math.min(60, Math.max(...a.map(q => String(q[i] ?? '').length)) + 3) }));
};

function exportXlsx() {
  if (!R || typeof XLSX === 'undefined') {
    alert('لا توجد بيانات أو تعذّر تحميل مكتبة Excel.');
    return;
  }
  const wb = XLSX.utils.book_new();
  const add = (n, a) => {
    const w = XLSX.utils.aoa_to_sheet(a);
    fitW(w);
    XLSX.utils.book_append_sheet(wb, w, n);
  };

  add('ملخص عام', [
    ['المعلمون', R.n],
    ['أيام الدوام', R.work.length],
    ['نسبة الحضور', pc(R.att)],
    ['إجمالي دقائق التأخير', R.lateMin],
    ['إجمالي دقائق المغادرة', R.earlyMin],
    ['إجمالي الغياب', R.abs],
    ['التقييم الكلي', R.avg.toFixed(2) + ' - ' + R.g[0]]
  ]);

  {
    const D = sumData(R.list);
    const ws = XLSX.utils.aoa_to_sheet([SUMH, ...D.rows.map(x => x.map((v, i) => i === 12 && v !== '' ? +v : v)), D.tot.map((v, i) => i === 12 && v !== '' ? +v : v)]);
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: D.rows.length, c: 13 } }) };
    fitW(ws);
    XLSX.utils.book_append_sheet(wb, ws, 'ملخص المعلمين');
  }

  {
    const dd = dailyData(R.list);
    const w2 = XLSX.utils.aoa_to_sheet([DAILYH, ...dd]);
    w2['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: dd.length, c: 8 } }) };
    fitW(w2);
    XLSX.utils.book_append_sheet(wb, w2, 'السجل اليومي');
  }

  add('التأخير', [
    ['المعلم', 'الرقم الوزاري', 'أيام التأخير', 'مجموع الدقائق', 'أطول تأخير'],
    ...R.list.filter(o => o.late.length).map(o => [o.name, o.id, o.late.length, o.lateMin, o.maxLate])
  ]);

  add('تفاصيل التأخير', [
    ['المعلم', 'التاريخ', 'اليوم', 'وقت الدخول', 'دقائق التأخير'],
    ...R.list.flatMap(o => o.late.map(x => [o.name, x.d, dn(x.d), fm(x.t), x.m]))
  ]);

  {
    const ee = earlyData(R.list);
    const w3 = XLSX.utils.aoa_to_sheet([EARLYH, ...ee.map(x => x.slice(0, 7))]);
    w3['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: ee.length, c: 6 } }) };
    fitW(w3);
    XLSX.utils.book_append_sheet(wb, w3, 'المغادرات');
  }

  {
    const aa = absData(R.list);
    const w4 = XLSX.utils.aoa_to_sheet([ABSH, ...aa.map(x => x.slice(0, 4))]);
    w4['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aa.length, c: 3 } }) };
    fitW(w4);
    XLSX.utils.book_append_sheet(wb, w4, 'الغياب');
  }

  add('مصفوفة الغياب', [
    ['المعلم', ...R.work],
    ...R.list.map(o => [o.name, ...R.work.map(d => o.cells[d] === 'ح' ? '✓' : o.cells[d] || '')])
  ]);

  add('التقييم', [
    ['المعلم', 'الرقم الوزاري', 'نسبة الحضور', 'نسبة الالتزام', 'الدرجة', 'التقدير'],
    ...R.list.filter(o => !o.irr).map(o => [o.name, o.id, pc(o.att), pc(o.pun), +o.score.toFixed(2), o.grade[0] + (o.few ? ' (بيانات ناقصة)' : '')])
  ]);

  add('غير منتظمين', [
    ['المعلم', 'التاريخ', 'اليوم', 'الدخول', 'الخروج'],
    ...R.list.filter(o => o.irr).flatMap(o => o.raw.map(x => [o.name, x.date, dn(x.date), fm(x.in ?? x.t), fm(x.out)]))
  ]);

  add('جودة البيانات', Object.entries(S.Q).filter(([k, v]) => typeof v === 'number').map(([k, v]) => [k, v]));

  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.writeFile(wb, 'تقرير_تحليل_بصمة_الدوام.xlsx');
}

/* ===== تصدير التقارير كملف PDF منظم وعالي الدقة عبر jsPDF ===== */

  if (!R || !S.recs.length) {
    alert('لا توجد بيانات حضور وانصراف لتصديرها كملف PDF.');
    return;
  }

  const jsPDFClass = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;

  if (!jsPDFClass || !html2canvasFn) {
    alert('تعذّر تحميل مكتبة jsPDF أو html2canvas. يرجى التأكد من توفر المكتبات لتصدير ملفات PDF.');
    return;
  }

  const toast = document.createElement('div');
  toast.id = 'pdf-loading-toast';
  toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#0f3d3e;color:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.3);font-size:0.92rem;font-weight:700;z-index:99999;display:flex;align-items:center;gap:10px;border:1.5px solid #e9a914;direction:rtl;';
  toast.innerHTML = '<span style="font-size:1.2rem">⏳</span> جارٍ إنشاء وتنسيق ملف PDF بدقة عالية…';
  document.body.append(toast);

  const wideTabs = ['sum', 'daily', 'matrix', 'dash', 'early', 'irr'];
  const orient = (S.po && S.po !== 'auto') ? S.po : (wideTabs.includes(S.tab) ? 'landscape' : 'portrait');

  const sandbox = document.createElement('div');
  sandbox.id = 'pdf-render-sandbox';
  const sandboxWidth = orient === 'landscape' ? 1120 : 794;
  sandbox.style.cssText = `
    position: fixed;
    top: 0;
    left: -9999px;
    width: ${sandboxWidth}px;
    background: #ffffff !important;
    color: #000000 !important;
    padding: 22px 26px;
    box-sizing: border-box;
    font-family: 'Tajawal', 'Cairo', 'Segoe UI', Tahoma, sans-serif !important;
    direction: rtl;
    z-index: -99999;
  `;

  try {
    const headerHtml = renderPrintHeader(TABS[S.tab] || 'الدوام');
    const headerWrap = document.createElement('div');
    headerWrap.innerHTML = headerHtml;
    const ph = headerWrap.querySelector('.printhead');
    if (ph) {
      ph.style.display = 'block';
      ph.style.marginBottom = '12px';
      sandbox.append(ph);
    }

    if (S.tab === 'sum') {
      const D = sumData(vis());
      const kpiBox = document.createElement('div');
      kpiBox.style.cssText = 'display:flex;justify-content:space-between;gap:6px;background:#f4f7f5;border:1px solid #c2d5ce;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:9.5px;color:#0e3334;';
      kpiBox.innerHTML = `
        <div><b>إجمالي الكادر:</b> ${D.rows.length} معلم</div>
        <div><b>أيام الحضور:</b> ${D.tot[3].toLocaleString('ar-EG')}</div>
        <div><b>أيام الغياب:</b> <span style="color:#c4473a;font-weight:700">${D.tot[4].toLocaleString('ar-EG')}</span></div>
        <div><b>دقائق التأخير:</b> <span style="color:#d97706;font-weight:700">${D.tot[6].toLocaleString('ar-EG')} د</span></div>
        <div><b>دقائق المغادرة:</b> ${D.tot[9].toLocaleString('ar-EG')} د</div>
        <div><b>متوسط التقييم العام:</b> <b>${D.tot[12]} / 10</b></div>
      `;
      sandbox.append(kpiBox);
    }

    const srcTable = document.querySelector('#main table.st, #main table.mx, #main table.kv');
    if (srcTable) {
      const clonedTable = srcTable.cloneNode(true);
      clonedTable.querySelectorAll('.noprint, .fr, .x, input, select, button').forEach(el => el.remove());

      clonedTable.querySelectorAll('tbody tr').forEach(tr => {
        if (tr.style.display === 'none') tr.remove();
      });

      clonedTable.querySelectorAll('details').forEach(d => { d.open = true; });

      clonedTable.style.width = '100%';
      clonedTable.style.tableLayout = 'auto';
      clonedTable.style.borderCollapse = 'collapse';
      clonedTable.style.fontSize = S.pf || '10px';
      clonedTable.style.margin = '8px 0';

      clonedTable.querySelectorAll('th, td').forEach(cell => {
        cell.style.position = 'static';
        cell.style.boxShadow = 'none';
        cell.style.border = '1px solid #444';
        cell.style.padding = '3px 5px';
        cell.style.color = '#000';
      });

      clonedTable.querySelectorAll('thead th, tfoot td').forEach(cell => {
        cell.style.background = '#e6ece9';
        cell.style.fontWeight = '700';
      });

      clonedTable.querySelectorAll('.col-name').forEach(cell => {
        cell.style.textAlign = 'right';
        cell.style.whiteSpace = 'nowrap';
      });

      const tableWrap = document.createElement('div');
      tableWrap.style.width = '100%';
      tableWrap.style.overflow = 'visible';
      tableWrap.append(clonedTable);
      sandbox.append(tableWrap);
    } else {
      const mainClone = document.querySelector('#main').cloneNode(true);
      mainClone.querySelectorAll('.noprint, #nav, button, input, select, .demo-bar, .sum-kpi-bar, .sum-toolbar').forEach(el => el.remove());
      mainClone.style.background = '#fff';
      sandbox.append(mainClone);
    }

    const footerWrap = document.createElement('div');
    footerWrap.innerHTML = renderPrintFooter();
    const pf = footerWrap.querySelector('.printfoot');
    if (pf) {
      pf.style.display = 'flex';
      pf.style.marginTop = '20px';
      pf.style.paddingTop = '8px';
      pf.style.borderTop = '1.5px solid #000';
      sandbox.append(pf);
    }

    document.body.append(sandbox);

    await new Promise(r => setTimeout(r, 120));

    const canvas = await html2canvasFn(sandbox, {
      scale: 2,
      useCORS: true,
      logging: false,
      backgroundColor: '#ffffff'
    });

    const pdf = new jsPDFClass({
      orientation: orient,
      unit: 'mm',
      format: 'a4'
    });

    const pageWidth = orient === 'landscape' ? 297 : 210;
    const pageHeight = orient === 'landscape' ? 210 : 297;
    const margin = 8;
    const printableWidth = pageWidth - (margin * 2);
    const printableHeight = pageHeight - (margin * 2);

    const totalImgHeight = (canvas.height * printableWidth) / canvas.width;

    if (totalImgHeight <= printableHeight) {
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.96), 'JPEG', margin, margin, printableWidth, totalImgHeight);
      pdf.setFontSize(8);
      pdf.setTextColor(120);
      pdf.text('نظام تحليل بصمة الدوام — صفحة 1 من 1', pageWidth / 2, pageHeight - 4, { align: 'center' });
    } else {
      const pageCanvasHeight = (canvas.width * printableHeight) / printableWidth;
      const totalPages = Math.ceil(canvas.height / pageCanvasHeight);
      let renderedHeight = 0;

      for (let p = 0; p < totalPages; p++) {
        if (p > 0) pdf.addPage();

        const sliceHeight = Math.min(canvas.height - renderedHeight, pageCanvasHeight);
        const pageCanvas = document.createElement('canvas');
        pageCanvas.width = canvas.width;
        pageCanvas.height = sliceHeight;

        const pctx = pageCanvas.getContext('2d');
        pctx.fillStyle = '#ffffff';
        pctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
        pctx.drawImage(canvas, 0, renderedHeight, canvas.width, sliceHeight, 0, 0, canvas.width, sliceHeight);

        const sliceImgHeight = (sliceHeight * printableWidth) / canvas.width;
        pdf.addImage(pageCanvas.toDataURL('image/jpeg', 0.96), 'JPEG', margin, margin, printableWidth, sliceImgHeight);

        pdf.setFontSize(8);
        pdf.setTextColor(120);
        pdf.text(`صفحة ${p + 1} من ${totalPages}`, pageWidth / 2, pageHeight - 4, { align: 'center' });

        renderedHeight += sliceHeight;
      }
    }

    const schoolName = (S.sel || 'المدرسة').replace(/[\s\/\\:*?"<>|]+/g, '_');
    const tabName = (TABS[S.tab] || 'تقرير').replace(/[\s\/\\:*?"<>|]+/g, '_');
    const dateStr = new Date().toISOString().slice(0, 10);
    const fileName = `${tabName}_${schoolName}_${dateStr}.pdf`;

    pdf.save(fileName);

    toast.innerHTML = '<span style="font-size:1.2rem">✓</span> تم تصدير ملف PDF بنجاح!';
    setTimeout(() => { toast.remove(); }, 2500);
  } catch(err) {
    console.error('Error generating PDF:', err);
    alert('حدث خطأ أثناء تصدير ملف PDF: ' + (err.message || err));
    if (toast) toast.remove();
  } finally {
    if (sandbox) sandbox.remove();
  }
}

  ];

  const dates = [];
  // شهر أكتوبر 2026: 22 يوم عمل تقريباً (الأحد-الخميس)
  for (let d = 1; d <= 31; d++) {
    const dt = `2026-10-${p2(d)}`;
    const dow = new Date(dt + 'T00:00:00Z').getUTCDay();
    if (dow >= 0 && dow <= 4) { // الأحد إلى الخميس
      // نعتبر 2026-10-15 عطلة مطولة
      if (d !== 15) dates.push(dt);
    }
  }

  const rows = [
    ['الرقم الوزاري', 'اسم المعلم', 'التاريخ', 'اول تسجيل دخول', 'اخر تسجيل خروج', 'المدرسة']
  ];

  teachers.forEach(t => {
    dates.forEach((d, dIdx) => {
      let skipDay = false;
      let inM = 450 + Math.floor(Math.random() * 12); // 07:30 - 07:42
      let outM = 742 + Math.floor(Math.random() * 15); // 12:22 - 12:37

      if (t.profile === 'perfect') {
        // دوام منتظم ومثالي

        if (dIdx % 5 === 2) inM = 478 + Math.floor(Math.random() * 10); // 07:58 (تأخير 13 دقيقة)
      } else if (t.profile === 'frequent_late') {
        if (dIdx % 3 === 0) inM = 485 + Math.floor(Math.random() * 15); // 08:05 - 08:20
      } else if (t.profile === 'severe_late') {
        if (dIdx === 6) inM = 545; // 09:05 (تأخير 80 دقيقة جسيم)
        if (dIdx === 14) inM = 530; // 08:50 (تأخير 65 دقيقة)
      } else if (t.profile === 'mild_early') {
        if (dIdx % 4 === 1) outM = 715; // 11:55 (مغادرة مبكرة 25 دقيقة)
      } else if (t.profile === 'occasional_abs') {
        if (dIdx === 4 || dIdx === 11) skipDay = true; // غياب يومين متفرقين
      } else if (t.profile === 'streak_abs') {
        if (dIdx >= 8 && dIdx <= 11) skipDay = true; // غياب 4 أيام متتالية
      } else if (t.profile === 'single_punch') {
        if (dIdx === 3 || dIdx === 12) outM = null; // نسي بصمة الخروج

        if (dIdx > 4) skipDay = true; // معلم بديل عمل أسبوع فقط

    }
  }, 250);
}

/* ===== قراءة الملفات والأحداث الذكية ===== */
async function load(f) {
  $('#main').innerHTML = `
    <div class="msg" style="display:flex;align-items:center;justify-content:center;gap:12px">
      <div style="font-size:1.8rem">⏳</div>
      <div>
        <b>جارٍ قراءة وفحص ملف «${esc(f.name)}» ذكياً…</b>
        <div style="font-size:.85rem;color:var(--mu);margin-top:4px">يتم التعرف التلقائي على صف الترويسة، أوراق العمل، وصيغ التواريخ والأوقات</div>
      </div>
    </div>`;

  try {
    if (typeof XLSX === 'undefined') {
      throw new Error('تعذّر تحميل مكتبة SheetJS؛ يرجى التأكد من توفر المكتبة في المتصفح.');
    }

    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true, raw: true });

    if (!wb.SheetNames || !wb.SheetNames.length) {
      throw new Error('الملف لا يحتوي على أي صفحات أو جداول صالحة.');
    }

    let bestSheetName = wb.SheetNames[0];
    let bestData = [];
    let bestScore = -1;

    for (const sName of wb.SheetNames) {
      const ws = wb.Sheets[sName];
      const sheetData = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      if (!sheetData || !sheetData.length) continue;

      const { score } = findHeaderRow(sheetData);
      let sheetWeight = score * 100 + Math.min(sheetData.length, 50);

      const normSheet = norm(sName);
      if (/حركات|بصم|دوام|حضور|log|attend|punch|trans/.test(normSheet)) {
        sheetWeight += 200;
      }

      if (sheetWeight > bestScore) {
        bestScore = sheetWeight;
        bestSheetName = sName;
        bestData = sheetData;
      }
    }

    if (!bestData.length) {
      throw new Error('لم يتم العثور على أي بيانات داخل أوراق العمل في هذا الملف.');
    }

    S.lastLoadedFile = { f, name: f.name, data: bestData, sheetName: bestSheetName };
    ingest(bestData, null, f.name);

    if (S.recs && S.recs.length) {
      S.tab = 'dash';
      view();
    }
  } catch(e) {
    $('#main').innerHTML = `
      <div class="msg" style="color:#c0392b;max-width:600px;margin:40px auto;background:#fff1f0;border:1.5px solid #f5c2be;border-radius:12px;padding:20px;text-align:center">
        <div style="font-size:2rem;margin-bottom:8px">⚠️</div>
        <b style="font-size:1.1rem">تعذّر إتمام الاستيراد التلقائي</b>
        <p style="margin:8px 0;font-size:.9rem;color:#555">${esc(e.message || 'الملف غير صالح أو تنسيقه غير مدعوم.')}</p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap">
          <button class="pb" onclick="view()">العودة للشاشة السابقة</button>
          ${S.lastLoadedFile && S.lastLoadedFile.data ? '<button class="pb" id="btnOpenColMapFromError" style="background:var(--ac2)">فتح مساعد مطابقة الأعمدة ⚙️</button>' : ''}
        </div>
      </div>`;

    $('#btnOpenColMapFromError')?.addEventListener('click', () => {
      if (S.lastLoadedFile && S.lastLoadedFile.data) {
        const found = findHeaderRow(S.lastLoadedFile.data);
        showColumnMappingModal(S.lastLoadedFile.data, found.headerRow, found.ix, S.lastLoadedFile.name);
      }
    });
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button') || e.target;
  if (t.dataset.del) {
    delRow(t.dataset.del, t.dataset.k);
  } else if (t.dataset.t) {
    S.tab = t.dataset.t;
    view();
  } else if (t.dataset.x === 'print') {
    doPrint();
  } else if (t.dataset.x === 'pdf') {
    exportPdf();
  } else if (t.dataset.x === 'restore') {
    S.delE = {}; S.skip = {}; S.noE = {}; view();
  } else if (t.dataset.x === 'xlsx') {
    exportXlsx();
  } else if (t.dataset.x === 'save') {
    saveSettings();
  } else if (t.dataset.x === 'reset_cfg') {
    resetSettings();
  } else if (t.dataset.x === 'open_colmap') {
    if (S.importMeta && S.importMeta.rawRows) {
      showColumnMappingModal(S.importMeta.rawRows, S.importMeta.headerRow, S.importMeta.ix, S.importMeta.fileName);
    } else if (S.lastLoadedFile && S.lastLoadedFile.data) {
      const found = findHeaderRow(S.lastLoadedFile.data);
      showColumnMappingModal(S.lastLoadedFile.data, found.headerRow, found.ix, S.lastLoadedFile.name);
    } else {
      alert('لا تتوفر بيانات خام لملف البصمة في الذاكرة لمطابقة الأعمدة.');
    }
  } else if (t.dataset.x === 'clear') {
    if (!S.recs.length) return;
    const teacherCount = R ? R.list.length : 0;
    const punchCount = S.recs.length;
    const fileName = (S.importMeta && S.importMeta.fileName) || (S.lastLoadedFile && S.lastLoadedFile.name) || '';

    showConfirmModal({
      title: 'تأكيد مسح جميع بيانات البصمة',
      message: 'أنت على وشك تفريغ ومسح جميع سجلات الحضور والانصراف والبيانات المحملة حالياً من ذاكرة المتصفح.',
      details: `
        <div style="background:var(--bg);border:1px solid var(--bd2);padding:12px 14px;border-radius:10px;font-size:.86rem;line-height:1.7;margin:12px 0;text-align:right">
          ${fileName ? `<div>• ملف البصمة: <b>${esc(fileName)}</b></div>` : ''}
          <div>• عدد المعلمين في الكادر: <b>${teacherCount.toLocaleString('ar-EG')} معلم</b></div>
          <div>• إجمالي السجلات والحركات: <b>${punchCount.toLocaleString('ar-EG')} حركة</b></div>
          <div style="color:#c4473a;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:6px">
            <span>⚠️</span> سيتم تفريغ كافة الجداول والتقارير والعودة لشاشة رفع الملفات الرئيسية.
          </div>
        </div>
      `,
      confirmText: 'نعم، مسح جميع البيانات 🗑️',
      cancelText: 'إلغاء والاحتفاظ بالبيانات',
      danger: true,
      icon: '🗑️',
      onConfirm: () => {
        S.recs = [];
        S.ov = {};
        S.exc = {};
        S.delE = {};
        S.skip = {};
        S.noE = {};
        S.flt = {};
        S.importMeta = null;
        S.lastLoadedFile = null;
        R = null;
        const fileInput = $('#file');
        if (fileInput) fileInput.value = '';
        view();
      }
    });
  } else if (t.dataset.k && (t.classList.contains('c-غ') || t.classList.contains('c-إ'))) {
    // تبديل الغياب بين مبرَّر وغير مبرَّر بنقرة واحدة في مصفوفة الغياب
    S.exc[t.dataset.k] = !S.exc[t.dataset.k];
    view();
  } else if (t.tagName === 'TH' && !t.classList.contains('fr') && t.closest('.st')) {
    // ترتيب الجدول بالنقر على رأس العمود
    const tb = t.closest('table').tBodies[0];
    const i = t.cellIndex;
    const d = t.dataset.d = t.dataset.d === '1' ? -1 : 1;
    const v = td => td.dataset.v ?? td.textContent;
    [...tb.rows].sort((a, b) => {
      const x = v(a.cells[i]), y = v(b.cells[i]);
      const nx = parseFloat(x), ny = parseFloat(y);
      return d * ((isNaN(nx) || isNaN(ny)) ? x.localeCompare(y, 'ar') : nx - ny);
    }).forEach(r => tb.append(r));
  }
});

document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'po') S.po = e.target.value;
  if (id === 'pf') S.pf = e.target.value;
  if (id === 'pbw') S.pbw = e.target.checked;
  if (e.target.dataset.cfg) setCfg(e.target.dataset.cfg, e.target.value);
  if (e.target.dataset.d !== undefined && e.target.tagName === 'SELECT') {
    const d = e.target.dataset.d;
    if (e.target.value) S.ov[d] = e.target.value;
    else delete S.ov[d];
    view();
  }
});
